common:
  device: auto
  eval_episodes: 10
  eval_freq: 10000
  gamma: 0.99
  log_freq: 1000
  save_freq: 50000
  seed: 42
  total_timesteps: 1000000
domain_randomization:
  damping_range:
  - 0.75
  - 1.25
  enabled: false
  friction_range:
  - 0.7
  - 1.3
  mass_range:
  - 0.8
  - 1.2
env_overrides:
  Ant-v5:
    total_timesteps: 2000000
  HalfCheetah-v5:
    total_timesteps: 1000000
  Humanoid-v5:
    total_timesteps: 3000000
network:
  activation: relu
  hidden_dims:
  - 256
  - 256
ppo:
  batch_size: 64
  clip_ratio: 0.2
  entropy_coef: 0.0
  gae_lambda: 0.95
  lr_actor: 0.0003
  lr_critic: 0.0003
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  normalize_advantage: true
  value_loss_coef: 0.5
reward_shaping:
  enabled: false
  type: default
sac:
  auto_entropy: true
  batch_size: 256
  buffer_size: 1000000
  gradient_steps: 1
  init_alpha: 0.2
  learning_starts: 10000
  lr_actor: 0.0003
  lr_alpha: 0.0003
  lr_critic: 0.0003
  tau: 0.005
  update_freq: 1
td3:
  batch_size: 256
  buffer_size: 1000000
  exploration_noise: 0.2
  gradient_steps: 1
  learning_starts: 10000
  lr_actor: 0.0003
  lr_critic: 0.0003
  noise_clip: 0.5
  normalize_reward: false
  policy_delay: 2
  reward_scale: 5.0
  target_noise: 0.2
  tau: 0.005
  update_freq: 1
