# =============================================================================
# MuJoCo RL 프로젝트 기본 설정 파일
# 환경별, 알고리즘별 hyperparameter 정의
# =============================================================================

# ---------------------
# 공통 설정
# ---------------------
common:
  device: "auto"              # auto | cpu | cuda
  total_timesteps: 1_000_000  # 총 학습 스텝
  eval_freq: 10_000           # 평가 주기 (스텝)
  eval_episodes: 10           # 평가 시 에피소드 수
  save_freq: 50_000           # 모델 저장 주기
  log_freq: 1_000             # 로깅 주기
  seed: 42
  gamma: 0.99                 # 할인 계수

# ---------------------
# 네트워크 공통
# ---------------------
network:
  hidden_dims: [256, 256]     # 히든 레이어 크기
  activation: "relu"          # relu | tanh

# ---------------------
# PPO Hyperparameters
# ---------------------
ppo:
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  n_steps: 2048               # 롤아웃 스텝 수
  batch_size: 64
  n_epochs: 10                # 미니배치 업데이트 반복 횟수
  clip_ratio: 0.2             # PPO 클리핑 범위 (ε)
  gae_lambda: 0.95            # GAE λ
  entropy_coef: 0.0           # 엔트로피 보너스 계수
  value_loss_coef: 0.5        # Value loss 가중치
  max_grad_norm: 0.5          # 그래디언트 클리핑 노름
  normalize_advantage: true   # 어드밴티지 정규화 여부

# ---------------------
# SAC Hyperparameters
# ---------------------
sac:
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  lr_alpha: 3.0e-4            # 엔트로피 계수 학습률
  batch_size: 256
  buffer_size: 1_000_000      # Replay Buffer 크기
  learning_starts: 10_000     # 학습 시작 전 랜덤 탐색 스텝
  tau: 0.005                  # Target network 소프트 업데이트 비율
  auto_entropy: true          # 자동 엔트로피 조절 여부
  init_alpha: 0.2             # 초기 엔트로피 계수 (auto=false일 때)
  update_freq: 1              # 매 스텝마다 업데이트
  gradient_steps: 1           # 업데이트당 그래디언트 스텝 수

# ---------------------
# TD3 Hyperparameters
# ---------------------
td3:
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  batch_size: 256
  buffer_size: 1_000_000
  learning_starts: 10_000
  tau: 0.005
  policy_delay: 2             # 정책 업데이트 지연 (매 N번째 critic 업데이트마다)
  exploration_noise: 0.1      # 탐색 노이즈 (가우시안 표준편차)
  target_noise: 0.2           # Target policy smoothing 노이즈
  noise_clip: 0.5             # Target 노이즈 클리핑 범위
  update_freq: 1
  gradient_steps: 1

# ---------------------
# 환경별 오버라이드 (필요 시)
# ---------------------
env_overrides:
  HalfCheetah-v5:
    total_timesteps: 1_000_000
  Ant-v5:
    total_timesteps: 2_000_000
  Humanoid-v5:
    total_timesteps: 3_000_000

# ---------------------
# Domain Randomization 설정
# ---------------------
domain_randomization:
  enabled: false
  friction_range: [0.7, 1.3]    # 마찰 계수 범위 (기본값 대비 비율)
  mass_range: [0.8, 1.2]        # 질량 범위
  damping_range: [0.75, 1.25]   # 감쇠 범위

# ---------------------
# Reward Shaping 설정
# ---------------------
reward_shaping:
  enabled: false
  type: "default"               # default | energy_efficient | stability | custom
